# ─────────────────────────────────────────────────────────────
# Signal K Plugin CI
#
# Calls the shared workflow maintained in SignalK/signalk-server, which is
# the same one the app store reads test results from. It runs the plugin on
# Linux x64/arm64, macOS and Windows, validates package.json against the app
# store rules, exercises start/stop/restart against a mock server and
# simulates an `npm install --ignore-scripts` app store install.
#
# Manual runs can additionally enable the armv7 (Cerbo GX / Venus OS) matrix
# and a real signalk-server integration test.
# ─────────────────────────────────────────────────────────────

name: Signal K Plugin CI

# The reusable workflow only ever reads this repository — it installs, builds
# and tests the plugin, and never writes to any GitHub resource. Declaring the
# scope here caps the GITHUB_TOKEN handed to it rather than inheriting whatever
# the repository default happens to be.
permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      node-versions:
        description: 'JSON array of Node versions, e.g. ["22","24"]'
        required: false
        default: '["22", "24"]'
        type: string
      enable-armv7:
        description: Run armv7 (Cerbo GX) tests via QEMU
        required: false
        default: false
        type: boolean
      enable-signalk-integration:
        description: Start a Signal K server and install the plugin into it
        required: false
        default: true
        type: boolean
      signalk-server-versions:
        description: 'JSON array of signalk-server versions, e.g. ["2.23.0","latest"]'
        required: false
        default: '["latest"]'
        type: string

jobs:
  # ── Automatic runs (push / pull request) ──────────────────
  plugin-ci:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: npm test
      build-command: npm run build
      format-check-command: npm run prettier:check
      node-versions: '["22", "24"]'
      enable-armv7: false
      enable-signalk-integration: true
      signalk-server-versions: '["latest"]'

  # ── Manual runs (workflow_dispatch with custom inputs) ────
  plugin-ci-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: npm test
      build-command: npm run build
      format-check-command: npm run prettier:check
      coverage-command: npm run coverage
      node-versions: ${{ inputs.node-versions }}
      enable-armv7: ${{ inputs.enable-armv7 }}
      enable-signalk-integration: ${{ inputs.enable-signalk-integration }}
      signalk-server-versions: ${{ inputs.signalk-server-versions }}
